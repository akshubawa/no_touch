name: no_touch
description: Touch lock for kids — block accidental taps with a floating unlock control.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app-logo.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/images/app-logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/app-logo.png
